# Dossierly "Restricted" egress policy for NemoClaw / OpenShell sandboxes.
# Only the hosts below are reachable; every other destination is denied and shows up
# as a Denied row in OpenShell's OCSF audit log (the privacy ledger).
# api.tokenfactory.nebius.com is allowed by NemoClaw's managed inference route (pinned IP,
# provider profile); declaring it again here is rejected by OpenShell as an endpoint overlap.
# www.gov.pl is added because gov.pl redirects there and udsc.gov.pl, mazowieckie.uw.gov.pl and
# mos.cudzoziemcy.gov.pl do not resolve in public DNS today (the pages live under www.gov.pl/web).
# Default presets brew-balanced, github, huggingface, npm and pypi are removed.
preset:
  name: dossierly-restricted
  description: "Dossierly Restricted: Token Factory, Dossierly hub, Polish official sources, Tavily"
network_policies:
  dossierly_restricted:
    name: dossierly_restricted
    endpoints:
      - host: dossierly.pages.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
          # The metering proxy: every model call from the sandbox goes through the Worker's daily cap.
          - allow: { method: POST, path: "/api/tf/*/*/v1/chat/completions" }
      - host: gov.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: www.gov.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: udsc.gov.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: migrant.wsc.mazowieckie.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: mazowieckie.uw.gov.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: mos.cudzoziemcy.gov.pl
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/search" }
          - allow: { method: POST, path: "/extract" }
    binaries:
      - { path: /usr/local/bin/dcode }
      - { path: /opt/venv/bin/python3* }
      - { path: /usr/bin/curl }
